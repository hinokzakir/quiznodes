syntax = "proto3";

package messenger;
import "messages.proto";

option java_package = "com.quiznodes.proto";
option java_multiple_files = true;

service serverToServerCommunication {
  rpc replicateQuiz(quizMessage) returns (replicateResponse);
  rpc sendLeaderHeartbeat(Empty) returns (heartbeatResponse);
  rpc getQuiz (quizId) returns (quizMessage);
  rpc joinNetwork (joinMessage) returns (Empty);
  rpc requestVote (requestVoteMessage) returns (responseVoteMessage);
}

message heartbeatResponse{
  int64 availableCapacity = 1;
}
message replicateResponse{
  int64 availableCapacity = 1;
}
message joinMessage{
  string ip = 1;
  int32 port = 2;
}

message requestVoteMessage{
  string ip = 1;
  int32 port = 2;
  uint64 term = 3;
}

message responseVoteMessage{
  uint64 term = 1;
  bool vote_granted = 2;
}