syntax = "proto3";

package messenger;

option java_package = "com.quiznodes.proto";
option java_multiple_files = true;

service serviceHandler {
    rpc testService (testMessage) returns (testMessage);
    rpc getQuiz (quizId) returns (quizMessage);
    rpc getAllQuiz (Empty) returns (quizList);
    rpc sendQuiz (quizMessage) returns (quizId);
    rpc deleteAllQuizzes (Empty) returns (Empty);
}

message Empty {

}

message testMessage {
    string msg = 1;
}

message questionMessage {
    string id = 1;
    string question = 2;
    string correctAnswer = 3;
    repeated string choices = 4;
}

message quizMessage {
    string id = 1;
    repeated questionMessage questions = 2;
    string name = 3;
    string payload = 4;
}

message quizList {
    repeated quizMessage quizzes = 1;
}

message quizId {
    string id = 1;
}