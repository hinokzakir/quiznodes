syntax = "proto3";

package messenger;

option java_package = "com.quiznodes.proto";
option java_multiple_files = true;

service serviceHandler {
    rpc testService (testMessage) returns (testMessage);
    rpc getQuiz (quizId) returns (quizMessage);
    rpc sendQuiz (quizMessage) returns (quizId);
}

message testMessage {
    string msg = 1;
}

message questionMessage {
    string id = 1;
    string question = 2;
    string correctAnswer = 3;
    repeated string choices = 4;
}

message quizMessage {
    string id = 1;
    repeated questionMessage questions = 2;    
}

message quizId {
    string id = 1;
}