syntax = "proto3";

package messenger;
import "messages.proto";
import "serverCommunication.proto";

option java_package = "com.quiznodes.proto";
option java_multiple_files = true;

service debugCommunication {
  rpc sleep (Empty) returns (Empty);
  rpc kill (Empty) returns (Empty);
  rpc addNewServer (joinMessage) returns (Empty);
}
